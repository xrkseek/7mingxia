<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>听一声 · 7鸣匣</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .play-page {
      max-width: 28rem;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 3rem;
    }
    .play-page h1 {
      font-family: "ZCOOL XiaoWei", "Songti SC", serif;
      font-size: 2.4rem;
      font-weight: 400;
      letter-spacing: 0.08em;
    }
    .play-lead {
      color: var(--mist);
      margin: 0.6rem 0 1.1rem;
    }
    .play-status {
      min-height: 1.4em;
      margin-bottom: 1rem;
      color: var(--sand);
    }
    .bugs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }
    .bugs button {
      appearance: none;
      border: 1px solid rgba(201, 161, 91, 0.45);
      background: rgba(20, 32, 26, 0.85);
      color: var(--sand);
      font: inherit;
      font-size: 1.05rem;
      padding: 0.95rem 0.5rem;
      cursor: pointer;
    }
    .bugs button:active { transform: scale(0.98); }
    .bugs button:disabled { opacity: 0.45; }
    .play-hint {
      margin-top: 1.1rem;
      font-size: 0.8rem;
      color: rgba(185, 199, 188, 0.72);
      line-height: 1.55;
    }
    .play-hint a { color: var(--amber); }
  </style>
</head>
<body>
  <main class="play-page">
    <h1>7鸣匣</h1>
    <p class="play-lead">点一只。灯只亮它，声音只放它。别人正在听时，你会自动排上。</p>
    <p class="play-status" id="status">靠近匣子，点下面任意一只。</p>
    <div class="bugs" id="bugs"></div>
    <p class="play-hint">请用安卓 Chrome 或电脑 Edge，并打开蓝牙。iPhone 自带浏览器不能连接。也可连热点 7MingXia。<br /><a href="index.html">看看七种虫</a></p>
  </main>
  <script>
    const TRACKS = ["蝉", "蟋蟀", "蝼蛄", "螽斯·昼", "螽斯·夜", "天牛", "蝗虫"];
    const SVC = "7e570001-7e57-4000-8000-00805f9b34fb";
    const CMD = "7e570002-7e57-4000-8000-00805f9b34fb";
    const STATE = "7e570003-7e57-4000-8000-00805f9b34fb";
    const statusEl = document.getElementById("status");
    const bugs = document.getElementById("bugs");
    const enc = new TextEncoder();
    const dec = new TextDecoder();
    let cmdChar = null;
    let pending = null;

    const setStatus = (t) => { statusEl.textContent = t; };

    TRACKS.forEach((name, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = name;
      b.addEventListener("click", () => onPick(i, name));
      bugs.appendChild(b);
    });

    function onState(text) {
      const p = text.trim().split(",");
      if (p.length < 2) return;
      const mine = p[0] === "1";
      const ahead = Number(p[1]);
      if (mine) setStatus("正在为你亮灯、播放。");
      else if (ahead > 0) setStatus("有人正在听。你前面还有 " + ahead + " 位，到了会自动播放。");
      else if (cmdChar) setStatus("匣子空着。再点一只即可。");
    }

    async function writeCmd(text) {
      await cmdChar.writeValue(enc.encode(text));
    }

    async function connect() {
      const dev = await navigator.bluetooth.requestDevice({
        filters: [{ name: "7MingXia" }],
        optionalServices: [SVC],
      });
      const server = await dev.gatt.connect();
      const svc = await server.getPrimaryService(SVC);
      cmdChar = await svc.getCharacteristic(CMD);
      const state = await svc.getCharacteristic(STATE);
      state.addEventListener("characteristicvaluechanged", (ev) => {
        onState(dec.decode(ev.target.value));
      });
      await state.startNotifications();
      dev.addEventListener("gattserverdisconnected", () => {
        cmdChar = null;
        setStatus("蓝牙断开了。再点一只重新连接。");
      });
    }

    async function onPick(i, name) {
      if (!navigator.bluetooth) {
        setStatus("这个浏览器没有网页蓝牙。请用安卓 Chrome 或电脑 Edge。");
        return;
      }
      pending = String(i);
      try {
        if (!cmdChar) {
          setStatus("请在窗口里选择 7MingXia…");
          await connect();
        }
        await writeCmd(pending);
        pending = null;
        setStatus("已点「" + name + "」。");
      } catch (e) {
        cmdChar = null;
        if (e && e.name === "NotFoundError") {
          setStatus("没找到匣子。请靠近一些，确认蓝牙已开。");
        } else if (!(e && e.name === "NotFoundError")) {
          setStatus("没有连上。再点一次。");
        }
      }
    }
  </script>
</body>
</html>
